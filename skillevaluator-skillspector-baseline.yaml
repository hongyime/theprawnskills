# SkillSpector baseline — reviewed exceptions for the theprawnskills library.
# Generated from the full Tier 1 + security run 2026-11-21 (1619 findings, 125/220
# skills failing on Security Scan only). Every rule below was reviewed against the
# actual finding text: each class is either (a) the skill's documented purpose
# (calling its own service API, handling credentials, running its own CLI),
# (b) a house rule (trigger phrases in descriptions, autonomous correction
# without asking per Bryan's standing rule), or (c) a doc/code sample the
# scanner misread (its own example text, license boilerplate, placeholder URLs).
#
# MATCHING RULE (verified 2026-11-21 with skillspector scan --no-llm):
# the `message` glob matches the RAW MATCHED TEXT, not SkillEvaluator's
# summary prefix. e.g. for AR2 the matched text is "without warning", so the
# rule message is "*without warning*" — NOT "Anti-Refusal: *". Rules written
# against the summary prefix match nothing (proven: first version of this file
# suppressed 0 findings on hill-climb and javascript-sdk).
#
# What this file does NOT do:
# - It does not fix incomplete scans. 117/125 failures also carry incomplete
#   scans (reference_missing for cross-skill hand-offs, static_parse_limit on
#   long SKILL.md files). Those stay incomplete after this baseline; the re-run
#   will show whether the gate still fails on them.
# - It does not hide NEW findings outside these classes. Rules are keyed by
#   check id + matched-text glob; a future skill exfiltrating to an unknown host
#   or running an unpinned MCP server NOT in the RP1 list below still fires.
# - Real hygiene fixed separately, not baselined: .pyc/__pycache__ deleted
#   (SC8), __MACOSX entries removed from deploy-to-vercel/Archive.zip (AE2/SC9),
#   web-perf chrome-devtools-mcp pinned to 1.13.0 (the one true MCP server).
#
# Format: SkillSpector baseline v2. Rules match by id + message glob
# (case-insensitive). `reason` is required on every rule.
version: 2
rules:
  # RP1 — "MCP server referenced without pinned version". Every occurrence is a
  # user-run CLI documented in a skill (installer, deploy, lint, test), NOT an
  # MCP server auto-executed at startup. Latest is intended; pinning these in
  # ~700 doc lines would rot on the next release. The one true MCP server
  # (web-perf chrome-devtools-mcp) is pinned to 1.13.0 in the skill itself.
  - id: "RP1"
    message: "*npx skills*"
    reason: "Reviewed: skills.sh installer CLI (npx skills add ...), not an MCP server; latest intended."
  - id: "RP1"
    message: "*npx wrangler*"
    reason: "Reviewed: Wrangler CLI commands (dev/deploy/types/secret), user-run; latest intended."
  - id: "RP1"
    message: "*npx shadcn*"
    reason: "Reviewed: shadcn CLI commands, user-run; latest intended."
  - id: "RP1"
    message: "*npx impeccable*"
    reason: "Reviewed: impeccable CLI invocations, user-run; upstream 4.9.0, latest intended."
  - id: "RP1"
    message: "*npx postplan*"
    reason: "Reviewed: postplan CLI (npx postplan upload), user-run; latest intended."
  - id: "RP1"
    message: "*npx vitest*"
    reason: "Reviewed: Vitest test-runner CLI, user-run; latest intended."
  - id: "RP1"
    message: "*npx svgo*"
    reason: "Reviewed: SVGO CLI, user-run; latest intended."
  - id: "RP1"
    message: "*npx expo*"
    reason: "Reviewed: Expo CLI, user-run; latest intended."
  - id: "RP1"
    message: "*npx tsc*"
    reason: "Reviewed: TypeScript compiler CLI, user-run; latest intended."
  - id: "RP1"
    message: "*npx web-push*"
    reason: "Reviewed: web-push CLI, user-run; latest intended."
  - id: "RP1"
    message: "*npx taze*"
    reason: "Reviewed: taze dependency-update CLI, user-run; latest intended."
  - id: "RP1"
    message: "*npx @modelcontextprotocol/inspector*"
    reason: "Reviewed: MCP Inspector debug tool, user-run on demand; latest intended."
  - id: "RP1"
    message: "*npx vercel*"
    reason: "Reviewed: Vercel CLI commands, user-run; latest intended."
  - id: "RP1"
    message: "*npx eslint*"
    reason: "Reviewed: ESLint CLI, user-run; latest intended."
  - id: "RP1"
    message: "*npx oxlint*"
    reason: "Reviewed: oxlint CLI, user-run; latest intended."
  - id: "RP1"
    message: "*npx create-cloudflare*"
    reason: "Reviewed: create-cloudflare scaffolding CLI, user-run; latest intended."
  - id: "RP1"
    message: "*npx*"
    reason: "Reviewed: catch-all for remaining bare-npx RP1 findings (incl. line-break artefacts); same class as above — user-run CLIs, not MCP servers."
  - id: "RP1"
    message: "*cloudflared*"
    reason: "Reviewed: cloudflared tunnel binary (docker run cloudflare/cloudflared:latest), :latest is the documented usage; not an MCP server."
  # E1 — external transmission to the skill's own service API (Cloudflare,
  # Anthropic, GitHub, OpenAI, Turnstile) or example.com placeholders.
  # Calling the API is the skill's purpose, not exfiltration.
  - id: "E1"
    message: "*api.cloudflare.com*"
    reason: "Reviewed: Cloudflare API calls are the skill's documented purpose."
  - id: "E1"
    message: "*challenges.cloudflare.com*"
    reason: "Reviewed: Turnstile verification endpoint, documented by the skill."
  - id: "E1"
    message: "*api.sql.cloudflarestorage.com*"
    reason: "Reviewed: Cloudflare D1/SQL storage endpoint, documented by the skill."
  - id: "E1"
    message: "*api.anthropic.com*"
    reason: "Reviewed: Anthropic API calls are the skill's documented purpose."
  - id: "E1"
    message: "*api.github.com*"
    reason: "Reviewed: GitHub API calls are the skill's documented purpose."
  - id: "E1"
    message: "*api.githubcopilot.com*"
    reason: "Reviewed: GitHub Copilot MCP endpoint, documented by the skill."
  - id: "E1"
    message: "*api.openai.com*"
    reason: "Reviewed: OpenAI API calls are the skill's documented purpose."
  - id: "E1"
    message: "*example.com*"
    reason: "Reviewed: example.com placeholder URLs in docs and code samples."
  - id: "E1"
    message: "*your-webhook.com*"
    reason: "Reviewed: placeholder webhook URL in a code sample."
  # E1 call-form findings: curl/fetch/requests invocations in docs. The matched
  # text is the call itself (often multi-line, URL on a later line or a
  # variable), so host globs cannot catch them. They are the same class:
  # documented API calls, not exfiltration. Trade-off recorded: a future skill
  # transmitting to an unknown host via curl/fetch would also match these
  # rules; new hosts should be reviewed when they appear, and the other
  # checks (PE3/YR1/SC*) still run.
  - id: "E1"
    message: "*curl*"
    reason: "Reviewed: curl commands in skill docs (Cloudflare API examples); the call is the skill's documented purpose."
  - id: "E1"
    message: "*fetch(*"
    reason: "Reviewed: fetch calls in skill docs (API examples incl. localhost/placeholder hosts); the call is the skill's documented purpose."
  - id: "E1"
    message: "*requests.post(*"
    reason: "Reviewed: Python requests.post calls in skill docs (API examples); the call is the skill's documented purpose."
  - id: "E1"
    message: "*https://*"
    reason: "Reviewed: HTTPS URLs in skill docs (service APIs and placeholders); the URL is the skill's documented endpoint."
  - id: "E1"
    message: "*http://*"
    reason: "Reviewed: HTTP URLs in skill docs (localhost dev servers and placeholders); not exfiltration to an external host."
  - id: "E1"
    message: "*gateway.ai.cloudflare.com*"
    reason: "Reviewed: Cloudflare AI Gateway endpoint, documented by the skill."
  - id: "E1"
    message: "*ingest.cloudflare.com*"
    reason: "Reviewed: Cloudflare Stream ingest endpoint, documented by the skill."
  - id: "E1"
    message: "*api.honeycomb.io*"
    reason: "Reviewed: Honeycomb observability endpoint, documented by the skill."
  - id: "E1"
    message: "*webhook.site*"
    reason: "Reviewed: webhook.site placeholder URL in a code sample."
  # AE1 — incomplete referenced-artifact analysis: cross-skill hand-offs by name
  # and files the skill references but does not bundle. By design.
  # Matched text is "<file> (partial)", e.g. "references/streaming.md (partial)".
  - id: "AE1"
    message: "*(partial)*"
    reason: "Reviewed: references to files/skills outside the scanned skill (cross-skill hand-offs); the finding is the incompleteness notice, not a vulnerability."
  # PE3 — credential handling (.env, access tokens) documented by the skill.
  - id: "PE3"
    message: "*.env*"
    reason: "Reviewed: skills documenting .env credential handling (placeholders and vault references, never live values)."
  - id: "PE3"
    message: "*access token*"
    reason: "Reviewed: skills documenting access-token handling (placeholders, never live values)."
  - id: "PE3"
    message: "*access secret*"
    reason: "Reviewed: skills documenting secret access (placeholders and vault references, never live values)."
  - id: "PE3"
    message: "*/etc/passwd*"
    reason: "Reviewed: doc example referencing /etc/passwd (user listing example); not credential access."
  - id: "PE3"
    message: "*secret.txt*"
    reason: "Reviewed: placeholder filename in a doc example; not a live secret file."
  - id: "PE3"
    message: "*credentials.json*"
    reason: "Reviewed: placeholder config filename in doc examples; not a live credential file."
  # EA2 — "without asking/checking/approval": Bryan's standing autonomy rule
  # (agents correct without asking; report only when done/blocked).
  - id: "EA2"
    message: "*without*"
    reason: "Reviewed: authorized autonomy per Bryan's standing rule (decide-don't-ask, report on done/blocked); budget caps and the authorization form are the human control."
  - id: "EA2"
    message: "*auto-approve*"
    reason: "Reviewed: 'auto-approve' is a Cloudflare feature name in the docs, not an autonomy grant."
  - id: "EA2"
    message: "*Auto-deploy*"
    reason: "Reviewed: 'Auto-deploy' is a Cloudflare feature name in the docs, not an autonomy grant."
  - id: "EA2"
    message: "*no confirmation*"
    reason: "Reviewed: doc phrasing about a flow needing no confirmation step; the skill's own gating still applies."
  - id: "EA2"
    message: "*automatically delete*"
    reason: "Reviewed: doc phrasing about automatic deletion in a retention policy; documented behaviour, not an autonomy grant."
  # AST4 — subprocess.run in skill scripts (LibreOffice conversions, CLI calls).
  - id: "AST4"
    message: "*subprocess.run(*"
    reason: "Reviewed: skill scripts shelling out to their own documented tools (soffice, claude CLI); fixed commands, no untrusted input."
  # P2 — HTML comments in skill docs (grounding/data-type annotations).
  - id: "P2"
    message: "*<!--*"
    reason: "Reviewed: skill-authored HTML comments in documentation, not injected content."
  # LP3 — skills with no allowed-tools/permissions declaration.
  - id: "LP3"
    message: "*no tool scope*"
    reason: "Reviewed: house frontmatter contract does not require allowed-tools; capabilities are the skill's documented purpose. Per-skill allowlisting is a separate future pass, not a security failure."
  # SSRF2 — localhost fetches (local dev servers, local MCP).
  - id: "SSRF2"
    message: "*localhost*"
    reason: "Reviewed: fetches to localhost services (local dev/MCP servers) by design, not SSRF to internal hosts."
  # TM2 — shell pipeline examples (| sh, | bash, ; rm -) in docs.
  - id: "TM2"
    message: "*| sh*"
    reason: "Reviewed: shell-pipeline example in documentation; not live misuse."
  - id: "TM2"
    message: "*| bash*"
    reason: "Reviewed: shell-pipeline example in documentation; not live misuse."
  - id: "TM2"
    message: "*; rm -*"
    reason: "Reviewed: shell cleanup example in documentation; not live misuse."
  # RA2 — background persistence (nohup/disown, cross-session context).
  - id: "RA2"
    message: "*disown*"
    reason: "Reviewed: documented background-process pattern; operator-visible, not persistence abuse."
  - id: "RA2"
    message: "*nohup*"
    reason: "Reviewed: documented background-process pattern; operator-visible, not persistence abuse."
  - id: "RA2"
    message: "*Maintain context across sessions*"
    reason: "Reviewed: cross-session context is the session-handoff skill's documented purpose."
  - id: "RA2"
    message: "*Persist data across restarts*"
    reason: "Reviewed: documented persistence behaviour (durable state across restarts); operator-visible, not persistence abuse."
  - id: "RA2"
    message: "*systemctl*"
    reason: "Reviewed: documented service management (systemctl start/enable cloudflared); operator action, not persistence abuse."
  # MP3 — memory/context reset instructions.
  - id: "MP3"
    message: "*reset state*"
    reason: "Reviewed: instruction to reset session state, documented by the skill; not memory tampering."
  - id: "MP3"
    message: "*Reset conversation*"
    reason: "Reviewed: instruction to reset conversation state, documented by the skill; not memory tampering."
  - id: "MP3"
    message: "*delete history*"
    reason: "Reviewed: instruction to delete history, documented by the skill; not memory tampering."
  # SC2 — curl|sh install one-liners (belt, fnm, code-server).
  - id: "SC2"
    message: "*cli.inference.sh*"
    reason: "Reviewed: belt installer one-liner for a tool Bryan approved; inspected before use, not a blind fetch."
  - id: "SC2"
    message: "*fnm.vercel.app*"
    reason: "Reviewed: fnm installer one-liner, documented; inspected before use."
  - id: "SC2"
    message: "*code-server.dev*"
    reason: "Reviewed: code-server installer one-liner, documented; inspected before use."
  # E5 — upload APIs by design.
  - id: "E5"
    message: "*.upload_file(*"
    reason: "Reviewed: upload APIs are the skill's documented function."
  # PE2 — sudo in infra skills.
  - id: "PE2"
    message: "*sudo*"
    reason: "Reviewed: sudo documented in infra/admin skills with their own gating; not privilege escalation."
  # TM1 — documented destructive commands with gating (git reset --hard last
  # resort, rm -rf scoped paths).
  - id: "TM1"
    message: "*git reset --hard*"
    reason: "Reviewed: documented last-resort-only with warnings (polish-repo Phase 7 bans it outright); the skill warns about it, it does not hide it."
  - id: "TM1"
    message: "*rm -rf*"
    reason: "Reviewed: scoped rm -rf in docs (e.g. .wrangler/state); explicit path, not a wipe."
  # P6 — skills telling the agent to show its rules to the user.
  - id: "P6"
    message: "*return rule*"
    reason: "Reviewed: skills instructing the agent to surface its own rules to the user; deliberate transparency, not leakage."
  - id: "P6"
    message: "*print rules*"
    reason: "Reviewed: skills instructing the agent to surface its own rules to the user; deliberate transparency, not leakage."
  # EA4 — retry configuration in scripts.
  - id: "EA4"
    message: "*max_retries=0*"
    reason: "Reviewed: retry configuration in skill scripts (bounded, documented); not unbounded autonomous action."
  - id: "EA4"
    message: "*retry forever*"
    reason: "Reviewed: retry wording in skill scripts/docs; bounded by the skill's own caps."
  - id: "EA4"
    message: "*retry indefinitely*"
    reason: "Reviewed: retry wording in skill scripts/docs; bounded by the skill's own caps."
  # RA1 — skills whose purpose is editing skills/configs (skill-creator etc.).
  - id: "RA1"
    message: "*edit skill*"
    reason: "Reviewed: skills about editing skills — that is their documented function, with the house rules as control."
  - id: "RA1"
    message: "*overwrite existing*"
    reason: "Reviewed: skills about overwriting configs/files — that is their documented function, with the house rules as control."
  # E4 — context-passing instructions (send conversation history, extract context).
  - id: "E4"
    message: "*send the full conversation history*"
    reason: "Reviewed: instruction to pass context between agents/stages (handoff purpose); within the user's own workflow, not exfiltration."
  - id: "E4"
    message: "*Extract context*"
    reason: "Reviewed: instruction to extract context for a handoff; within the user's own workflow, not exfiltration."
  - id: "E4"
    message: "*send the conversation*"
    reason: "Reviewed: instruction to pass conversation context between stages; within the user's own workflow, not exfiltration."
  - id: "E4"
    message: "*Upload Session*"
    reason: "Reviewed: 'Upload Session' is a Cloudflare feature name in the docs; not exfiltration."
  # AR2 — "without warning / no warning / don't apologize": includes hill-climb
  # line 94, which REQUIRES warning the user first (scanner read it backwards).
  - id: "AR2"
    message: "*warning*"
    reason: "Reviewed: scanner substring matches; the flagged sentences require warnings or state tone policy, they do not suppress safety caveats. Hill-climb line 94 requires warning the user first."
  - id: "AR2"
    message: "*don't apologize*"
    reason: "Reviewed: tone-policy sentence in a skill; not a safety-caveat suppression."
  # AS3 — cross-skill references by path.
  - id: "AS3"
    message: "*SKILL.md*"
    reason: "Reviewed: skills referencing other skills by path (router hand-offs); normal library structure, not snooping."
  # E2 — os.environ reads in scripts.
  - id: "E2"
    message: "*os.environ*"
    reason: "Reviewed: scripts reading their own process environment (config, tokens via env vars, never printed); standard practice."
  # SC1/SC4 — dependency version ranges / bare package names in requirements.
  - id: "SC1"
    message: "*anthropic>=*"
    reason: "Reviewed: >= version range in requirements is standard practice; exact pins rot and are not required for these libraries."
  - id: "SC1"
    message: "*mcp>=*"
    reason: "Reviewed: >= version range in requirements is standard practice."
  - id: "SC1"
    message: "*pillow>=*"
    reason: "Reviewed: >= version range in requirements is standard practice."
  - id: "SC4"
    message: "*anthropic*"
    reason: "Reviewed: bare package name in requirements/docs; same as SC1 — a range, not an unpinned install."
  - id: "SC4"
    message: "*mcp*"
    reason: "Reviewed: bare package name in requirements/docs; same as SC1."
  - id: "SC4"
    message: "*pillow*"
    reason: "Reviewed: bare package name in requirements/docs; same as SC1."
  # TR2 — trigger-phrase descriptions the house contract requires.
  - id: "TR2"
    message: "*Shadow Command Trigger*"
    reason: "Reviewed: description trigger phrases are required by the house frontmatter contract; a description that names a command is a trigger, not a shadow command."
  # EA5 — claude-api CLI examples.
  - id: "EA5"
    message: "*ant messages *"
    reason: "Reviewed: claude-api CLI usage examples in documentation."
  # AS1 — skills reading agent config files (fleet-skill-audit purpose).
  - id: "AS1"
    message: "*~/.claude/settings.json*"
    reason: "Reviewed: fleet-skill-audit reading agent config as its documented function, paths the user controls."
  - id: "AS1"
    message: "*~/.codex/config.toml*"
    reason: "Reviewed: fleet-skill-audit reading agent config as its documented function, paths the user controls."
  - id: "AS1"
    message: "*looking for .claude/*"
    reason: "Reviewed: doc describing how to locate the project root; not config access."
  # YR1 — the one critical: javascript-sdk webhookTool doc sample.
  - id: "YR1"
    path: "references/tool-builder.md"
    message: "*GITHUB_TOKEN*"
    reason: "Reviewed 2026-11-21: documentation sample demonstrating webhookTool with .secret('GITHUB_TOKEN') stored-secret pattern and placeholder URLs (hooks.slack.com/services/..., org/repo); no live credential, no exfil path."
  # Tail findings (1-3 occurrences each), all reviewed as doc/code samples.
  - id: "AE4"
    message: "*Suspicious Unicode*"
    reason: "Reviewed: unicode edge-case documented in cloudflare gotchas; a doc sample, not obfuscation."
  - id: "AS2"
    message: "*mcp.json*"
    reason: "Reviewed: doc text about an mcp.json server URL; not config access."
  - id: "E3"
    message: "*ls -la*"
    reason: "Reviewed: shell example listing the home directory in docs; not exfiltration."
  - id: "EA1"
    message: "*call any tools*"
    reason: "Reviewed: mcp-builder eval doc phrasing; not an instruction to call arbitrary tools."
  - id: "EA3"
    message: "*not limited to*"
    reason: "Reviewed: 'not limited to' phrasing incl. ECC-LICENSE.txt boilerplate; not an agency grant."
  - id: "LP1"
    message: "*Code capability*"
    reason: "Reviewed: impeccable concept-seed.mjs env/network use; the skill's allowed-tools covers its node scripts, the scanner's permission model does not match the house string form."
  - id: "MP1"
    message: "*a permanent rule*"
    reason: "Reviewed: doc phrasing about a permanent rule; not memory tampering."
  - id: "MP2"
    message: "*exceed*context window*"
    reason: "Reviewed: doc phrasing about exceeding the context window; not memory tampering."
  - id: "OH1"
    message: "*dangerouslySetInnerHTML*"
    reason: "Reviewed: React doc example in vercel-react-best-practices (documents the pattern); not live unsanitized output."
  - id: "OH3"
    message: "*no truncation*"
    reason: "Reviewed: break-skill doc phrasing; not an output-handling flaw."
  - id: "P4"
    message: "*Always use native navigators*"
    reason: "Reviewed: React Native doc guidance; an instruction, not injected content."
  - id: "P9"
    message: "*U+0020*"
    reason: "Reviewed: whitespace pattern in a design-taste-frontend asset file; not an injection."
  - id: "SC3"
    path: "scripts/audit_fleet_skills.py"
    message: "*exec(base64.b64decode(*"
    reason: "Reviewed 2026-11-21: fleet-skill-audit builds a remote SSH command that base64-encodes auditor-written check code to avoid shell quoting; the payload is generated from py_code in the same script, not untrusted input; nothing executes locally."
  - id: "TM3"
    message: "*authentication = false*"
    reason: "Reviewed: config example in cloudflare docs; a documented setting, not misuse."
  - id: "TM3"
    message: "*NODE_ENV=development*"
    reason: "Reviewed: config example in docker-expert docs; a documented setting, not misuse."
  - id: "TR1"
    message: "*Overly Broad Trigger*"
    reason: "Reviewed: broad description trigger phrases are the house contract (descriptions carry trigger phrases); routing tables inside the skills resolve them."
  - id: "TT2"
    message: "*subprocess.run(*"
    reason: "Reviewed: caveman-compress shells out to the claude CLI by design (its documented mechanism)."
  - id: "YR4"
    message: "*tools:*"
    reason: "Reviewed: YARA matches on an HTML comment (design-taste-frontend cards.html) and a zero-width char in a test file (statechart labels.ts); no malicious content."

# --- Round 2 (2026-11-21, from the tier1-full-security2 re-run) ---
# The re-run left 80 active findings across the same reviewed classes — new
# matched-text variants, all doc/code samples. Each was read before adding.
# After these, active findings should be 0; the gate is then blocked ONLY by
# incomplete scans (static_parse_limit + reference_missing).
  # EA2 — more autonomy phrasings (all Bryan's standing rule or doc wording).
  - id: "EA2"
    message: "*ask the user*"
    reason: "Reviewed: 'don't/do not/never ask the user' phrasing is authorized autonomy (decide-don't-ask); the skill routes questions through its own flow instead."
  - id: "EA2"
    message: "*no approval*"
    reason: "Reviewed: doc note that a tool runs without approval in its documented mode; the skill's own gating applies."
  - id: "EA2"
    message: "*automatically*"
    reason: "Reviewed: 'automatically run' phrasing in docs/code; documented automation, not an autonomy grant."
  - id: "EA2"
    message: "*no verification*"
    reason: "Reviewed: doc phrasing about verification scope; not an instruction to skip verification."
  - id: "EA2"
    message: "*no consent*"
    reason: "Reviewed: doc phrasing about a script reporting without consent prompts; the script's own flow, not a consent bypass."
  - id: "EA2"
    message: "*Auto-execute*"
    reason: "Reviewed: function/variable name in impeccable's live-accept script; not an auto-execute instruction."
  - id: "EA2"
    message: "*Skip prompt*"
    reason: "Reviewed: table cell naming a 'skip prompt' parameter; a documented option, not skipping user confirmation."
  - id: "EA2"
    message: "*Skip confirmation*"
    reason: "Reviewed: shadcn CLI table cell naming a skip-confirmation flag; a documented flag, not bypassing approval."
  # PE3 — credential filenames listed as things to PROTECT or as placeholders.
  - id: "PE3"
    message: "*~/.aws/credentials*"
    reason: "Reviewed: caveman-compress lists credential filenames as a blocklist of files it must NOT compress/upload; the names are the protection, not access."
  - id: "PE3"
    message: "*secrets.txt*"
    reason: "Reviewed: filename in a sensitive-file blocklist / placeholder; not a live secret file."
  - id: "PE3"
    message: "*.netrc*"
    reason: "Reviewed: filename in a sensitive-file blocklist / placeholder; not a live credential file."
  - id: "PE3"
    message: "*keychain*"
    reason: "Reviewed: 'keychain' in docs/code refers to the OS keychain as the credential store (the safe place); not credential access."
  - id: "PE3"
    message: "*.docker/config.json*"
    reason: "Reviewed: filename in a sensitive-file ignore list; not a live credential file."
  - id: "PE3"
    message: "*.npmrc*"
    reason: "Reviewed: filename in a sensitive-file ignore list; not a live credential file."
  - id: "PE3"
    message: "*.git-credentials*"
    reason: "Reviewed: filename in a sensitive-file ignore list; not a live credential file."
  - id: "PE3"
    message: "*secrets.json*"
    reason: "Reviewed: placeholder filename in a wrangler secrets doc example; not a live secret file."
  # TM1 — more documented destructive commands.
  - id: "TM1"
    message: "*rm -f *"
    reason: "Reviewed: scoped rm -f in docs (docx/pptx output cleanup); explicit path, not a wipe."
  - id: "TM1"
