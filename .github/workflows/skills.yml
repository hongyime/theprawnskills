name: Skill library

on:
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - 'platforms/linux/**'
      - 'scripts/install_skills.py'
      - 'tests/**'
      - 'default-profile.toml'
      - '.github/workflows/skills.yml'
  pull_request:
    paths:
      - 'skills/**'
      - 'platforms/linux/**'
      - 'scripts/install_skills.py'
      - 'tests/**'
      - 'default-profile.toml'
      - '.github/workflows/skills.yml'

permissions:
  contents: read

concurrency:
  group: skills-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
