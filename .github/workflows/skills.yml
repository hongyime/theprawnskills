name: Skill library

on:
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - 'platforms/linux/**'
      - 'scripts/**'
      - 'tests/**'
      - 'default-profile.toml'
      - 'INDEX.md'
      - 'requirements-skill-checks.txt'
      - 'requirements-browser-checks.txt'
      - '.github/workflows/skills.yml'
  pull_request:
    paths:
      - 'skills/**'
      - 'platforms/linux/**'
      - 'scripts/**'
      - 'tests/**'
      - 'default-profile.toml'
      - 'INDEX.md'
      - 'requirements-skill-checks.txt'
      - 'requirements-browser-checks.txt'
      - '.github/workflows/skills.yml'

permissions:
  contents: read

concurrency:
  group: skills-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-skill-checks.txt
      - run: python scripts/update_skill_index.py --check
      - run: python scripts/audit_text_safety.py
      - run: python scripts/audit_skill_resources.py
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v6
        with:
          node-version: '26'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: tests/fixtures/react-testing
      - run: npm test
        working-directory: tests/fixtures/react-testing
      - run: python -m pip install -r requirements-browser-checks.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s tests -p test_browser_examples.py -v
        env:
          PRAWN_BROWSER_TESTS: '1'
